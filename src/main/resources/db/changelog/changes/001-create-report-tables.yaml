databaseChangeLog:
  - changeSet:
      id: 001-create-report-tables
      author: pedidos360
      changes:
        - createTable:
            tableName: order_fact
            columns:
              - column: {name: order_id, type: BIGINT, constraints: {primaryKey: true, nullable: false}}
              - column: {name: customer_id, type: INT, constraints: {nullable: false}}
              - column: {name: status, type: VARCHAR(30), constraints: {nullable: false}}
              - column: {name: total_amount, type: "DECIMAL(19,2)", constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: delivered_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: cancelled_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: last_event_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - createIndex:
            tableName: order_fact
            indexName: idx_order_fact_created_at
            columns:
              - column: {name: created_at}
        - createIndex:
            tableName: order_fact
            indexName: idx_order_fact_delivered_at
            columns:
              - column: {name: delivered_at}
        - createTable:
            tableName: order_fact_item
            columns:
              - column: {name: order_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: product_id, type: INT, constraints: {nullable: false}}
              - column: {name: quantity, type: INT, constraints: {nullable: false}}
              - column: {name: unit_price, type: "DECIMAL(19,2)", constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: order_fact_item
            baseColumnNames: order_id
            referencedTableName: order_fact
            referencedColumnNames: order_id
            constraintName: fk_order_fact_item_order
            onDelete: CASCADE
        - createTable:
            tableName: processed_event
            columns:
              - column: {name: id, type: VARCHAR(36), constraints: {primaryKey: true, nullable: false}}
              - column: {name: processed_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
