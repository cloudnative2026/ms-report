spring.application.name=ms-report
server.port=${SERVER_PORT:8084}

# Shared MySQL RDS (same as ms-catalog/ms-orders); the report_db database is created on first start.
# The local compose overrides SPRING_DATASOURCE_URL with PostgreSQL; the driver follows the URL.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/report_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER:https://login.microsoftonline.com/f9bce5c0-eb96-4341-aad7-411ae980b12a/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE:c1e3acd7-4501-432e-a446-71ab2dca8ac3}

# Consumes audit.timeline; failed records end in audit.timeline.ms-report.DLT.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ms-report
spring.kafka.consumer.auto-offset-reset=earliest
